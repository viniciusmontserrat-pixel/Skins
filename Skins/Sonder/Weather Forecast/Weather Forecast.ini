[Rainmeter]
Update=1000
Author=Connect-R
DynamicWindowSize=1
MouseScrollUpAction=[!SetVariable Scale "(#Scale#+#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#+#ScrollMouseIncrement#)"][!Refresh]
MouseScrollDownAction=[!SetVariable Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!Refresh]

[Variables]
@include=#@#Variables.inc
@include2=#@#Language\Language.inc
Scale=0.95
Lat=0
Lon=0
WeatherURL=https://api.open-meteo.com/v1/forecast?latitude=#Lat#&longitude=#Lon#&current=temperature_2m%2Crelative_humidity_2m%2Cweather_code%2Cwind_speed_10m&daily=weather_code%2Ctemperature_2m_max%2Ctemperature_2m_min&timezone=America%2FSao_Paulo&forecast_days=5&wind_speed_unit=kmh

;-------------------------------------------------------------
; WEATHER - OPEN-METEO / CONFIGURE LOCATION
;-------------------------------------------------------------

[MeasureCurrentWeather]
Measure=WebParser
URL=#WeatherURL#
RegExp=(?siU).*"current":\{.*"temperature_2m":([-0-9.]+),.*"relative_humidity_2m":([0-9]+),.*"weather_code":([0-9]+),.*"wind_speed_10m":([-0-9.]+)\}.*
UpdateRate=1800
Timeout=30000
UserAgent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) Rainmeter-WebParser
Header1=Accept: application/json
Header2=Cache-Control: no-cache
ForceReload=1
DynamicVariables=1
FinishAction=[!UpdateMeasure MeasureWeatherTempRaw][!UpdateMeasure MeasureWeatherTemp][!UpdateMeasure MeasureHum][!UpdateMeasure MeasureWeatherCond][!UpdateMeasure MeasureWeatherIcons][!UpdateMeasure MeasureWindSpeed][!UpdateMeter *][!Redraw]
OnConnectErrorAction=[!Log "WEATHER CURRENT: erro de conexão com Open-Meteo" "Error"]
OnRegExpErrorAction=[!Log "WEATHER CURRENT: RegExp não encontrou dados atuais" "Error"]

[MeasureDailyWeather]
Measure=WebParser
URL=#WeatherURL#
RegExp=(?siU).*"daily":\{"time":\["[0-9-]+","[0-9]{4}-[0-9]{2}-([0-9]{2})","[0-9]{4}-[0-9]{2}-([0-9]{2})","[0-9]{4}-[0-9]{2}-([0-9]{2})","[0-9]{4}-[0-9]{2}-([0-9]{2})"\],"weather_code":\[[0-9]+,([0-9]+),([0-9]+),([0-9]+),([0-9]+)\],"temperature_2m_max":\[[0-9.-]+,([0-9.-]+),([0-9.-]+),([0-9.-]+),([0-9.-]+)\],"temperature_2m_min":\[[0-9.-]+,([0-9.-]+),([0-9.-]+),([0-9.-]+),([0-9.-]+)\].*
UpdateRate=1800
Timeout=30000
UserAgent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) Rainmeter-WebParser
Header1=Accept: application/json
Header2=Cache-Control: no-cache
ForceReload=1
DynamicVariables=1
FinishAction=[!UpdateMeasureGroup WeatherDailyData][!UpdateMeter *][!Redraw]
OnConnectErrorAction=[!Log "WEATHER DAILY: erro de conexão com Open-Meteo" "Error"]
OnRegExpErrorAction=[!Log "WEATHER DAILY: RegExp não encontrou previsão diária" "Error"]

[MeasureTempUnit]
Measure=Calc
Formula=1
Substitute="1":"C"

[MeasureLocation]
Measure=Calc
Formula=1
Substitute="1":"LOCATION"

;-------------------------------------------------------------
; CONDIÇÕES ATUAIS
;-------------------------------------------------------------

[MeasureWeatherTempRaw]
Measure=WebParser
URL=[MeasureCurrentWeather]
StringIndex=1
DynamicVariables=1
UpdateDivider=-1

[MeasureWeatherTemp]
Measure=Calc
Formula=Round(MeasureWeatherTempRaw)
UpdateDivider=-1

[MeasureHum]
Measure=WebParser
URL=[MeasureCurrentWeather]
StringIndex=2
DynamicVariables=1
UpdateDivider=-1

[MeasureWeatherCond]
Measure=WebParser
URL=[MeasureCurrentWeather]
StringIndex=3
Substitute="0":"Céu limpo","1":"Predom. limpo","2":"Parcialmente nublado","3":"Nublado","45":"Neblina","48":"Neblina com geada","51":"Garoa fraca","53":"Garoa","55":"Garoa forte","56":"Garoa congelante fraca","57":"Garoa congelante forte","61":"Chuva fraca","63":"Chuva","65":"Chuva forte","66":"Chuva congelante fraca","67":"Chuva congelante forte","71":"Neve fraca","73":"Neve","75":"Neve forte","77":"Grãos de neve","80":"Pancadas fracas","81":"Pancadas de chuva","82":"Pancadas fortes","85":"Pancadas de neve","86":"Neve forte","95":"Trovoadas","96":"Trovoadas com granizo","99":"Trovoadas fortes"
DynamicVariables=1
UpdateDivider=-1

[MeasureWeatherIcons]
Measure=WebParser
URL=[MeasureCurrentWeather]
StringIndex=3
Substitute="0":"32","1":"34","2":"30","3":"26","45":"20","48":"20","51":"11","53":"11","55":"11","56":"8","57":"8","61":"12","63":"12","65":"12","66":"10","67":"10","71":"14","73":"14","75":"16","77":"14","80":"39","81":"39","82":"40","85":"41","86":"42","95":"37","96":"38","99":"38"
DynamicVariables=1
UpdateDivider=-1

[MeasureWindSpeed]
Measure=WebParser
URL=[MeasureCurrentWeather]
StringIndex=4
DynamicVariables=1
UpdateDivider=-1

[MeasureWindUnit2]
Measure=Calc
Formula=1
Substitute="1":"km/h"

;-------------------------------------------------------------
